[package]
name = "acari"
version = "0.12.0"
edition = "2024"
default-run = "acari"
repository = "https://github.com/lucaswilliameufrasio/acari"
authors = ["Lucas Eufrasio"]
license = "MIT"

[[bin]]
name = "acari-privileged-helper"
path = "src/bin/privileged_helper.rs"

[[example]]
name = "acari-gpui-preview"
path = "examples/gpui_preview.rs"
required-features = ["gpui-kit"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "7.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
gpui-kit = { version = "0.9.0", optional = true }
jwalk = "0.9"
libc = "0.2"
ratatui = "0.30"
rayon = "1.12"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2.0"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.2"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[features]
gpui-kit = ["dep:gpui-kit"]
