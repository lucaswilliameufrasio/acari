name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, auto, canary]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/CODEOWNERS'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/CODEOWNERS'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Set temp directory on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          mkdir -p "D:\a\_temp"
          echo "TEMP=D:\a\_temp" >> $GITHUB_ENV
          echo "TMP=D:\a\_temp" >> $GITHUB_ENV
        shell: bash

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.99 with lint components
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Lint (rustfmt)
        run: cargo fmt --all --check

      - name: Lint (installer script syntax)
        run: sh -n scripts/install.sh

      - name: Test release tool archive validation
        run: python -m unittest discover -s scripts -p test_build_release_tool.py

      - name: Test analyzer run identity projection
        run: python -m unittest discover -s scripts -p test_cururu_analysis_status.py

      - name: Test analyzer status collection
        run: python -m unittest discover -s scripts -p test_collect_cururu_analysis.py

      - name: Test PR head resolution
        if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts -p test_resolve_cururu_head.py

      - name: Lint (clippy)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build-and-test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Set temp directory on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          mkdir -p "D:\a\_temp"
          echo "TEMP=D:\a\_temp" >> $GITHUB_ENV
          echo "TMP=D:\a\_temp" >> $GITHUB_ENV
        shell: bash

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.99
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.151

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build
        run: cargo build --locked --all-targets

      - name: Run tests
        run: cargo nextest run --locked --all-targets

      - name: Verify headless dry-run flow
        run: cargo nextest run --locked --test cli headless_dry_run_does_not_remove_files

      - name: Check branch naming convention
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        shell: bash
        run: |
          branch="${{ github.head_ref }}"
            if [[ "$branch" =~ ^(feature|bugfix)/(issue-[0-9]+[-_a-zA-Z0-9]+|[-_a-zA-Z0-9]+)$ ]] || [[ "$branch" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Branch name '$branch' OK"
          else
            echo "::error title=Branch name::Branch '$branch' does not match pattern: <feature|bugfix>/[issue-<number>-]<description>"
            exit 1
          fi

      - name: Check CHANGELOG updated
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base".."$head" | grep -c 'CHANGELOG\.md' || true)"
          code_changed="$(git diff --name-only "$base".."$head" | grep -cE '\.rs$|Cargo\.toml$|Cargo\.lock$' || true)"
          if [ "$code_changed" -gt 0 ] && [ "$changed" -eq 0 ]; then
            echo "::warning title=CHANGELOG::CHANGELOG.md was not updated in this PR."
          fi

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.99
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build rustdoc
        run: cargo doc --locked --no-deps

  license-check:
    name: License compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.99
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Build cargo-about with audited dependencies
        run: |
          python scripts/build-release-tool.py cargo-about --root "$RUNNER_TEMP/acari-tools"
          echo "$RUNNER_TEMP/acari-tools/bin" >> "$GITHUB_PATH"
      - name: Validate third-party licenses
        run: |
          cargo about generate about.hbs -o "$RUNNER_TEMP/THIRD-PARTY-LICENSES.md"
          diff -u THIRD-PARTY-LICENSES.md "$RUNNER_TEMP/THIRD-PARTY-LICENSES.md"

  release-tool-build:
    name: Build release tools
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - name: Build audited tools
        shell: bash
        run: |
          python scripts/build-release-tool.py cargo-about --root "$RUNNER_TEMP/acari-tools"
          python scripts/build-release-tool.py cargo-dist --root "$RUNNER_TEMP/acari-tools"
          "$RUNNER_TEMP/acari-tools/bin/cargo-about" --version
          "$RUNNER_TEMP/acari-tools/bin/dist" --version
          "$RUNNER_TEMP/acari-tools/bin/dist" plan --no-local-paths --output-format=json > "$RUNNER_TEMP/dist-plan.json"
